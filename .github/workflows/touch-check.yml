name: QuizDip Touch checks
on:
  push:
    branches: [dev, main]
    paths:
      - "apps/touch/**"
      - ".github/workflows/touch-check.yml"
  pull_request:
    paths:
      - "apps/touch/**"
      - ".github/workflows/touch-check.yml"
permissions:
  contents: read
jobs:
  touch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Syntax verification
        run: |
          for file in apps/touch/src/*.js; do node --check "$file"; done
      - name: Gesture and scoring tests
        run: node --test apps/touch/tests/*.test.mjs
